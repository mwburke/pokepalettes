        const rows = Math.ceil(CANVAS_H / PIXEL);

        // Poisson-placed metaball centers; generous min count for full coverage
        const centers = poissonRect(-40, CANVAS_W + 40, -20, CANVAS_H + 20, 58, 24);
        const radii = centers.map(() => 28 + random() * 28);

        // Single-pass domain warp (moderate amplitude)
        const WARP = 60;
        const wscale = 0.008;

        // Palette: substrate at low field, primary at mid, accent bright at high
        const subRgbP  = hexToRgb(sub);
        const primRgb  = hexToRgb(prim);
        const acc1Rgb  = hexToRgb(pickBucket(acc, accT));
        const THRESHOLD = 1.0; // metaball iso-surface

        g.noStroke();
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const px0 = col * PIXEL;
                const py0 = row * PIXEL;
                if (spriteHaloMask(px0 + PIXEL * 0.5, py0 + PIXEL * 0.5) > 0.5) continue;

                // Single domain warp pass
                const wx1 = noise(px0 * wscale,       py0 * wscale      ) - 0.5;
                const wy1 = noise(px0 * wscale + 3.7, py0 * wscale + 1.3) - 0.5;
                const wx = px0 + wx1 * WARP;
                const wy = py0 + wy1 * WARP;

                // Metaball field: sum of r²/(d²+1) falloffs
                let field = 0;
                for (let ci = 0; ci < centers.length; ci++) {
                    const dx = wx - centers[ci].x;
                    const dy = wy - centers[ci].y;
                    field += radii[ci] * radii[ci] / (dx * dx + dy * dy + 1);
                }

                if (field < THRESHOLD * 0.85) continue;
                // Smooth alpha falloff at the iso-surface edge
                const edgeAlpha = Math.min(1, (field - THRESHOLD * 0.85) / (THRESHOLD * 0.15));

                // Normalize: 0 at isosurface, 1 at very high field (blob center)
                const t = Math.min(1, (field - THRESHOLD) / (THRESHOLD * 1.5));
                // substrate → primary → accent gradient
                let cr, cg, cb;
                if (t < 0.5) {
                    const tt = t * 2;
                    cr = subRgbP[0] + (primRgb[0] - subRgbP[0]) * tt;
                    cg = subRgbP[1] + (primRgb[1] - subRgbP[1]) * tt;
                    cb = subRgbP[2] + (primRgb[2] - subRgbP[2]) * tt;
                } else {
                    const tt = (t - 0.5) * 2;
                    cr = primRgb[0] + (acc1Rgb[0] - primRgb[0]) * tt;
                    cg = primRgb[1] + (acc1Rgb[1] - primRgb[1]) * tt;
                    cb = primRgb[2] + (acc1Rgb[2] - primRgb[2]) * tt;
                }

                g.fill(cr, cg, cb, (185 + t * 70) * edgeAlpha);
                g.rect(px0, py0, PIXEL, PIXEL);
            }
        }

        // Soft blur pass to smooth pixel grid and create slime-like blending
        g.filter(g.BLUR, 3);

        // Toxic glow specks (SCREEN blend)
        g.push();
        g.blendMode(g.SCREEN);
        g.noStroke();
        for (let m = 0; m < 80; m++) {
            const x = random(CANVAS_W), y = random(CANVAS_H);
            if (spriteHaloMask(x, y) > 0.5) continue;
            const [r2, gn, b2] = hexToRgb(pickBucket(acc, accT));
            g.fill(r2, gn, b2, 90 + random() * 110);
            g.circle(x, y, 1 + random() * 2.5);
        }
        g.pop();
        g.blendMode(g.BLEND);

        applyVignette(g, 0.38);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: ICE — symmetric DLA snowflakes (real crystalline growth)
    // DLA confined to a 60° wedge, then mirrored 12-fold to produce structurally
    // correct snowflakes with 6-fold rotational + 1-fold mirror symmetry.
    // ═══════════════════════════════════════════════════════════════════════
    function engineIce(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.30);
        const bot = lerpHex(sub, prim, 0.10);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // ---------- DLA snowflake generator (confined to 60° wedge) ----------
        function growSnowflake(walkers) {
            const GW = 140;
            const cx = GW / 2;
            const cy = GW / 2;
            const cluster = new Uint8Array(GW * GW);
            const parent = new Int32Array(GW * GW).fill(-1);
            // Seed at center
            const seedI = Math.floor(cy) * GW + Math.floor(cx);
            cluster[seedI] = 1;

            const maxR = GW / 2 - 4;
            const maxR2 = maxR * maxR;
            const wedgeAngle = Math.PI / 3;
            let bboxR = 2;     // current cluster outer radius
            let stuck = 1;

            for (let w = 0; w < walkers; w++) {
                // Spawn just outside current cluster at random wedge angle
                const r = bboxR + 4;
                const ang = random() * wedgeAngle;
                let x = Math.floor(cx + Math.cos(ang) * r);
                let y = Math.floor(cy + Math.sin(ang) * r);
                if (x < 0 || x >= GW || y < 0 || y >= GW) continue;

                for (let step = 0; step < 1500; step++) {
                    // Stick check
                    let parIdx = -1;
                    for (let dy = -1; dy <= 1 && parIdx < 0; dy++) {
                        for (let dx = -1; dx <= 1 && parIdx < 0; dx++) {
                            if (dx === 0 && dy === 0) continue;
                            const nx = x + dx, ny = y + dy;
                            if (nx < 0 || nx >= GW || ny < 0 || ny >= GW) continue;
                            if (cluster[ny * GW + nx]) parIdx = ny * GW + nx;
                        }
                    }
                    if (parIdx >= 0) {
                        const i = y * GW + x;
                        cluster[i] = 1;
                        parent[i] = parIdx;
                        stuck++;
                        // Update bbox radius
                        const dx2 = x - cx, dy2 = y - cy;
                        const rr = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                        if (rr > bboxR) bboxR = rr;
                        break;
                    }
                    // Try random walk; reject moves that leave the wedge
                    const oldX = x, oldY = y;
                    const rr = random();
                    if      (rr < 0.25) y -= 1;
                    else if (rr < 0.50) y += 1;
                    else if (rr < 0.75) x -= 1;
                    else                 x += 1;
                    // Constraint: must remain in wedge angle [0, π/3]
                    const ndx = x - cx, ndy = y - cy;
                    const newAng = Math.atan2(ndy, ndx);
                    if (newAng < 0 || newAng > wedgeAngle) { x = oldX; y = oldY; }
                    // Constraint: must remain inside max radius
                    if (ndx * ndx + ndy * ndy > maxR2) break;
                }
            }
            return { GW, cx, cy, cluster, parent };
        }

        // Place 4–6 snowflakes at different positions/sizes
        const NFLAKES = 4 + Math.floor(random() * 3);
        const flakePositions = poissonRect(60, CANVAS_W - 60, 60, CANVAS_H - 60, 160, NFLAKES * 3);
        const flakes = flakePositions.slice(0, NFLAKES);
        for (let fi = 0; fi < flakes.length; fi++) {
            const f = flakes[fi];
            if (spriteHaloMask(f.x, f.y) > 0.55) continue;
            const walkers = 800 + Math.floor(random() * 1400);
            const flake = growSnowflake(walkers);
            const flakeRadius = 50 + random() * 110;
            const scale = flakeRadius / (flake.GW / 2);
            const baseHex = pickBucket(body, bodyT);
            const tipHex  = pickBucket(acc, accT);
            const baseRgb = hexToRgb(baseHex);
            const tipRgb  = hexToRgb(tipHex);

            // Render 12 mirror/rotation copies
            for (let mir = 0; mir < 2; mir++) {
                for (let rot = 0; rot < 6; rot++) {
                    g.push();
                    g.translate(f.x, f.y);
                    g.rotate(rot * Math.PI / 3);
                    if (mir === 1) g.scale(1, -1);
                    // Draw branches as anti-aliased lines
                    g.strokeCap(g.ROUND);
                    for (let i = 0; i < flake.cluster.length; i++) {
                        if (!flake.cluster[i] || flake.parent[i] < 0) continue;
                        const x1 = ((i % flake.GW) - flake.cx) * scale;
                        const y1 = (Math.floor(i / flake.GW) - flake.cy) * scale;
                        const p_ = flake.parent[i];
                        const x2 = ((p_ % flake.GW) - flake.cx) * scale;
                        const y2 = (Math.floor(p_ / flake.GW) - flake.cy) * scale;
                        // Color: base near center → tip at extremities
                        const distFrac = Math.min(1, Math.hypot(x1, y1) / flakeRadius);
                        const cr = baseRgb[0] + (tipRgb[0] - baseRgb[0]) * distFrac;
                        const cg = baseRgb[1] + (tipRgb[1] - baseRgb[1]) * distFrac;
                        const cb = baseRgb[2] + (tipRgb[2] - baseRgb[2]) * distFrac;
                        // Outer glow
                        g.stroke(cr, cg, cb, 30);
                        g.strokeWeight(3.5);
                        g.line(x1, y1, x2, y2);
                        // Mid
                        g.stroke(cr, cg, cb, 130);
                        g.strokeWeight(1.4);
                        g.line(x1, y1, x2, y2);
                        // Bright core
                        g.stroke(255, 252, 245, 220);
                        g.strokeWeight(0.5);
                        g.line(x1, y1, x2, y2);
                    }
                    g.pop();
                }
            }
            // Central glow
            radialFillCircle(g, f.x, f.y, 30,
                [{ at: 0, hex: tipHex, alpha: 0.5 },
                 { at: 1, hex: sub, alpha: 0 }]);
        }

        // Frost dust
        g.push();
        g.blendMode(g.SCREEN);
        g.noStroke();
        for (let k = 0; k < 220; k++) {
            const x = random(CANVAS_W), y = random(CANVAS_H);
            if (spriteHaloMask(x, y) > 0.5) continue;
            const [r, gn, b] = hexToRgb(pickBucket(acc, accT));
            g.fill(r, gn, b, 60 + random() * 130);
            g.circle(x, y, 0.6 + random() * 1.6);
        }
        g.pop();
        g.blendMode(g.BLEND);

        applyVignette(g, 0.30);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: FIGHTING — radial impact lines from focal point + bruised gradient
    // ═══════════════════════════════════════════════════════════════════════
    function engineFighting(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.40);
        const bot = lerpHex(sub, prim, 0.25);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // Place 2-3 impact origins (off-center, away from sprite)
        const origins = [
            { x: CANVAS_W * 0.30, y: CANVAS_H * 0.45 },
            { x: CANVAS_W * 0.18, y: CANVAS_H * 0.75 },
            { x: CANVAS_W * 0.55, y: CANVAS_H * 0.30 },
        ];
        // Radial impact rings
        g.push();
        g.noFill();
        g.blendMode(g.SCREEN);
        for (const o of origins) {
            const accHex = pickBucket(acc, accT);
            const ac = hexToRgb(accHex);
            for (let k = 0; k < 5; k++) {
                const r = 30 + k * 24 + random() * 8;
                g.stroke(ac[0], ac[1], ac[2], 100 - k * 18);
                g.strokeWeight(1.4 - k * 0.2);
                // Draw arc fragment (not full circle — fighting feels jagged)
                const startA = random() * Math.PI * 2;
                const arc = Math.PI * (0.5 + random() * 0.8);
                g.beginShape();
                for (let a = startA; a < startA + arc; a += 0.05) {
                    g.vertex(o.x + Math.cos(a) * r, o.y + Math.sin(a) * r);
                }
                g.endShape();
            }
        }
        g.pop();
        g.blendMode(g.BLEND);

        // Background noise texture: bruised energy field
        g.noStroke();
        const BSCALE = 6;
        const bodyBg1 = pickBucket(body, bodyT);
        const bodyBg2 = pickBucket(body, bodyT);
        const bgRgb1 = hexToRgb(bodyBg1), bgRgb2 = hexToRgb(bodyBg2);
        for (let by2 = 0; by2 < CANVAS_H; by2 += BSCALE) {
            for (let bx2 = 0; bx2 < CANVAS_W; bx2 += BSCALE) {
                if (spriteHaloMask(bx2, by2) > 0.5) continue;
                const n = noise(bx2 * 0.014, by2 * 0.014);
                if (n < 0.55) continue;
                const t = (n - 0.55) / 0.45;
                const cr = bgRgb1[0] + (bgRgb2[0] - bgRgb1[0]) * t;
                const cg = bgRgb1[1] + (bgRgb2[1] - bgRgb1[1]) * t;
                const cb = bgRgb1[2] + (bgRgb2[2] - bgRgb1[2]) * t;
                g.fill(cr, cg, cb, t * 60);
                g.rect(bx2, by2, BSCALE, BSCALE);
            }
        }

        // Radial fracture lines from each origin — deep branching
        g.push();
        for (const o of origins) {
            const NLINES = 20 + Math.floor(random() * 10);
            for (let i = 0; i < NLINES; i++) {
                const ang = (i / NLINES) * Math.PI * 2 + random() * 0.15;
                const len = 100 + random() * 300;
                const hex = pickBucket(body, bodyT);
                const x1 = o.x + Math.cos(ang) * 10;
                const y1 = o.y + Math.sin(ang) * 10;
                const x2 = o.x + Math.cos(ang) * len;
                const y2 = o.y + Math.sin(ang) * len;
                if (spriteHaloMask(x2, y2) > 0.5) continue;
                drawLightning(g, x1, y1, x2, y2, 5, 0.28, hex, 155, 1.0);
                // Explicit splits at 55%, 70%, 85% of crack — more splits farther out
                const splitFracs = [0.55, 0.70, 0.85];
                for (const frac of splitFracs) {
                    if (random() > 0.65) continue;
                    const bx = o.x + Math.cos(ang) * len * frac;
                    const by = o.y + Math.sin(ang) * len * frac;
                    if (spriteHaloMask(bx, by) > 0.5) continue;
                    const branchAng = ang + (random() - 0.5) * 1.5;
                    const branchLen = len * (0.18 + random() * 0.32) * (1 - frac + 0.3);
                    const bx2 = bx + Math.cos(branchAng) * branchLen;
                    const by2 = by + Math.sin(branchAng) * branchLen;
                    if (spriteHaloMask(bx2, by2) < 0.5)
                        drawLightning(g, bx, by, bx2, by2, 4, 0.36, pickBucket(acc, accT), 105, 0.75);
                }
            }
            // Motion blur streaks tangent to origin (kinetic shockwave)
            g.push();
            g.blendMode(g.SCREEN);
            g.noFill();
            const accHex = pickBucket(acc, accT);
            const c = hexToRgb(accHex);
            for (let k = 0; k < 8; k++) {
                const startA = random() * Math.PI * 2;
                const arcSpan = Math.PI * (0.15 + random() * 0.25);
                const r = 50 + k * 22 + random() * 12;
                g.stroke(c[0], c[1], c[2], 60 + random() * 40);
                g.strokeWeight(0.8 + random() * 1.2);
                g.beginShape();
                for (let a = startA; a < startA + arcSpan; a += 0.05) {
                    g.vertex(o.x + Math.cos(a) * r, o.y + Math.sin(a) * r);
                }
                g.endShape();
            }
            g.pop();
            g.blendMode(g.BLEND);
            // Bright impact center with multi-pass bloom
            drawBloom(g, o.x, o.y, pickBucket(acc, accT), 22, 1.8);
            drawBloom(g, o.x, o.y, pickBucket(acc, accT), 10, 1.4);
        }
        g.pop();


        applyVignette(g, 0.42);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: GROUND — stratified bands with strong domain warp + sub-stripes
    // ═══════════════════════════════════════════════════════════════════════
    function engineGround(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.30);
        const bot = lerpHex(sub, prim, 0.20);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        const warpSeed = random() * 1000;
        const warpSeed2 = random() * 1000;

        // Horizontal sediment bands with DOUBLE warp octave for visible folding
        const NBANDS = 16;
        const bandTops = [];  // store for grit-at-faults reference
        let y = 0;
        for (let i = 0; i < NBANDS && y < CANVAS_H; i++) {
            const bh = 30 + random() * 80;
            const hex = pickBucket(body, bodyT);
            const path = [];
            const STEPS = 56;
            // Top edge — large warp (60) + small second octave
            for (let k = 0; k <= STEPS; k++) {
                const x = (k / STEPS) * CANVAS_W;
                const w1 = domainWarp(x, y, 60, warpSeed);
                const w2 = domainWarp(x * 2, y * 2, 18, warpSeed2);
                path.push({ x, y: y + w1.dy + w2.dy * 0.4 });
            }
            // Bottom edge
            for (let k = STEPS; k >= 0; k--) {
                const x = (k / STEPS) * CANVAS_W;
                const w1 = domainWarp(x, y + bh, 60, warpSeed);
                const w2 = domainWarp(x * 2, (y + bh) * 2, 18, warpSeed2);
                path.push({ x, y: y + bh + w1.dy + w2.dy * 0.4 });
            }
            fillPathLinearGradient(g, path, 0, y, 0, y + bh,
                [{ at: 0, hex: lerpHexToHex(hex, '#000000', 0.2), alpha: 0.85 },
                 { at: 1, hex, alpha: 0.85 }]);

            // Geological sub-stripes within each band (3–5 thin color variations)
            const NSUB = 3 + Math.floor(random() * 3);
            for (let si = 0; si < NSUB; si++) {
                const subY = y + (si / NSUB) * bh + random() * (bh / NSUB) * 0.5;
                const subH = 2 + random() * 4;
                const subHex = pickBucket(body, bodyT);
                const subPath = [];
                for (let k = 0; k <= 32; k++) {
                    const x = (k / 32) * CANVAS_W;
                    const w1 = domainWarp(x, subY, 55, warpSeed);
                    subPath.push({ x, y: subY + w1.dy });
                }
                for (let k = 32; k >= 0; k--) {
                    const x = (k / 32) * CANVAS_W;
                    const w1 = domainWarp(x, subY + subH, 55, warpSeed);
                    subPath.push({ x, y: subY + subH + w1.dy });
                }
                fillPathLinearGradient(g, subPath, 0, subY, 0, subY + subH,
                    [{ at: 0, hex: lerpHexToHex(subHex, '#000000', 0.15), alpha: 0.6 },
                     { at: 1, hex: subHex, alpha: 0.5 }]);
            }

            bandTops.push(y);
            y += bh;
        }

        // Blur the strata bands before adding sharp details on top
        g.filter(g.BLUR, 2);

        // Fault lines: 5–8 diagonal accent fissures with wide glow + sharp crack
        const faultPts = [];
        const NFAULTS = 5 + Math.floor(random() * 4);
        for (let i = 0; i < NFAULTS; i++) {
            const x1 = random(CANVAS_W), y1 = random(CANVAS_H);
            const ang = (random() < 0.5 ? -1 : 1) * (Math.PI / 4 + random() * 0.6);
            const len = 220 + random() * 450;
            const x2 = x1 + Math.cos(ang) * len, y2 = y1 + Math.sin(ang) * len;
            faultPts.push({ x1, y1, x2, y2 });
            const hex = pickBucket(acc, accT);
            const glowHex = lerpHexToHex(hex, '#ffffff', 0.35);
            // Wide soft glow channel
            drawLightning(g, x1, y1, x2, y2, 3, 0.06, glowHex, 55, 5.0);
            // Mid-weight colored crack
            drawLightning(g, x1, y1, x2, y2, 4, 0.12, hex, 170, 1.8);
            // Bright thin core
            drawLightning(g, x1, y1, x2, y2, 4, 0.10, glowHex, 220, 0.6);
        }

        // Noise grain overlay — coarser, higher contrast for rocky texture
        g.noStroke();
        const GSCALE = 3;
        for (let gy = 0; gy < CANVAS_H; gy += GSCALE) {
            for (let gx = 0; gx < CANVAS_W; gx += GSCALE) {
                if (spriteHaloMask(gx, gy) > 0.5) continue;
                const coarse = (noise(gx * 0.020, gy * 0.020) - 0.5) * 2;
                const fine   = (noise(gx * 0.10,  gy * 0.10)  - 0.5) * 2;
                const shift  = coarse * 35 + fine * 14;
                if (Math.abs(shift) < 5) continue;
                const hex = pickBucket(body, bodyT);
                const c = hexToRgb(hex);
                const alpha = Math.abs(shift) * 3.0;
                g.fill(
                    Math.max(0, Math.min(255, c[0] + shift)),
                    Math.max(0, Math.min(255, c[1] + shift * 0.7)),
                    Math.max(0, Math.min(255, c[2] + shift * 0.4)),
                    alpha
                );
                g.rect(gx, gy, GSCALE, GSCALE);
            }
        }

        // Mineral grit — denser near faults
        g.push();
        g.blendMode(g.SCREEN);
        g.noStroke();
        for (let k = 0; k < 600; k++) {
            const x = random(CANVAS_W), y = random(CANVAS_H);
            if (spriteHaloMask(x, y) > 0.5) continue;
            let nearFault = false;
            for (const f of faultPts) {
                const mx = (f.x1 + f.x2) / 2, my = (f.y1 + f.y2) / 2;
                if (Math.hypot(x - mx, y - my) < 85) { nearFault = true; break; }
            }
            const [r, gn, b] = hexToRgb(pickBucket(acc, accT));
            g.fill(r, gn, b, nearFault ? 160 : 70);
            g.circle(x, y, 0.5 + random() * (nearFault ? 2.8 : 1.4));
        }
        g.pop();
        g.blendMode(g.BLEND);

        // Micro-cracks from fault endpoints
        for (const f of faultPts) {
            for (const [ex, ey] of [[f.x1, f.y1], [f.x2, f.y2]]) {
                const NMICRO = 4 + Math.floor(random() * 4);
                for (let m = 0; m < NMICRO; m++) {
                    const ang = random() * Math.PI * 2;
                    const len = 25 + random() * 80;
                    const mx2 = ex + Math.cos(ang) * len;
                    const my2 = ey + Math.sin(ang) * len;
                    if (spriteHaloMask((ex + mx2) / 2, (ey + my2) / 2) > 0.5) continue;
                    drawLightning(g, ex, ey, mx2, my2, 3, 0.28, pickBucket(acc, accT), 120, 0.8);
                }
            }
        }

        applyVignette(g, 0.35);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: FLYING — volumetric clouds + crepuscular rays + wind particle flow
    // ═══════════════════════════════════════════════════════════════════════
    function engineFlying(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;

        // 1. Sky gradient
        const top = lerpHex(sub, '#000000', 0.25);
        const bot = lerpHex(sub, prim, 0.40);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // 2. Sun bloom — large soft radial in upper-left
        const sunX = CANVAS_W * (0.08 + random() * 0.12);
        const sunY = CANVAS_H * (0.04 + random() * 0.10);
        const sunHex = pickBucket(acc, accT);
        radialFillCircle(g, sunX, sunY, 300, [
            { at: 0,    hex: lerpHexToHex(sunHex, '#ffffff', 0.55), alpha: 0.70 },
            { at: 0.18, hex: sunHex,                                 alpha: 0.35 },
            { at: 1,    hex: sub,                                    alpha: 0 }
        ]);

        // 3. Crepuscular god-rays radiating from sun
        g.push();
        g.blendMode(g.SCREEN);
        const NRAYS = 10 + Math.floor(random() * 8);
        for (let i = 0; i < NRAYS; i++) {
            const ang = Math.PI * 0.15 + (i / NRAYS) * Math.PI * 1.1 + (random() - 0.5) * 0.18;
            const rayLen = CANVAS_H * (0.7 + random() * 0.8);
            const halfW  = (0.025 + random() * 0.06) * rayLen;
            const rayHex = lerpHexToHex(pickBucket(acc, accT), '#ffffff', 0.45);
            const perpX  = -Math.sin(ang), perpY = Math.cos(ang);
            const ex = sunX + Math.cos(ang) * rayLen;
            const ey = sunY + Math.sin(ang) * rayLen;
            const path = [
                { x: sunX + perpX * halfW * 0.05, y: sunY + perpY * halfW * 0.05 },
                { x: ex  + perpX * halfW,          y: ey  + perpY * halfW },
                { x: ex  - perpX * halfW,          y: ey  - perpY * halfW },
                { x: sunX - perpX * halfW * 0.05,  y: sunY - perpY * halfW * 0.05 }
            ];
            fillPathLinearGradient(g, path, sunX, sunY, ex, ey, [
                { at: 0,    hex: rayHex, alpha: 0.28 + random() * 0.18 },
                { at: 0.55, hex: rayHex, alpha: 0.08 },
                { at: 1,    hex: rayHex, alpha: 0 }
            ]);
        }
        g.pop();
        g.blendMode(g.BLEND);

        // 4. Cloud formations — two depth layers (far + near)
        function drawCloudLayer(count, minSpacing, yTop, yBot, sizeScale, alphaScale) {
            const formations = poissonRect(-80, CANVAS_W + 80, yTop, yBot, minSpacing, count);
            for (const f of formations) {
                if (spriteHaloMask(f.x, f.y) > 0.45) continue;
                const cloudW = (80 + random() * 200) * sizeScale;
                const cloudH = cloudW * (0.25 + random() * 0.30);
                const NBLOBS = 8 + Math.floor(random() * 10);
                const baseHex   = pickBucket(body, bodyT);
                const litHex    = lerpHexToHex(baseHex, '#ffffff', 0.55);
                const shadowHex = lerpHexToHex(baseHex, sub, 0.50);
                for (let bi = 0; bi < NBLOBS; bi++) {
                    const ox = (noise(f.x * 0.008 + bi * 1.4, 0.1) - 0.5) * cloudW * 1.6;
                    const oy = (noise(0.1, f.y * 0.008 + bi * 1.4) - 0.5) * cloudH * 1.2;
                    const bx = f.x + ox, by = f.y + oy;
                    if (spriteHaloMask(bx, by) > 0.5) continue;
                    const r = cloudH * (0.50 + random() * 0.65);
                    const litness = Math.max(0, Math.min(1, 0.5 - oy / cloudH));
                    const cloudHex = litness > 0.5
                        ? lerpHexToHex(baseHex, litHex, (litness - 0.5) * 2)
                        : lerpHexToHex(shadowHex, baseHex, litness * 2);
                    radialFillCircle(g, bx, by, r, [
                        { at: 0,   hex: cloudHex, alpha: 0.90 * alphaScale },
                        { at: 0.5, hex: baseHex,  alpha: 0.65 * alphaScale },
                        { at: 1,   hex: sub,       alpha: 0 }
                    ]);
                }
                radialFillCircle(g, f.x + (random()-0.5)*cloudW*0.3, f.y - cloudH*0.38, cloudH*0.65, [
                    { at: 0, hex: litHex, alpha: 0.40 * alphaScale },
                    { at: 1, hex: sub,    alpha: 0 }
                ]);
            }
        }
        // Far layer — smaller, higher, subtler
        drawCloudLayer(18, 100, CANVAS_H * 0.02, CANVAS_H * 0.45, 0.65, 0.70);
        // Near layer — larger, fuller coverage
        drawCloudLayer(22, 90, CANVAS_H * 0.10, CANVAS_H * 0.88, 1.0, 1.0);

        // 5. Wind gusts — smooth curl-noise curves, mix of thick gusts + thin streaks
        g.push();
        g.blendMode(SECONDARY_MODE ? g.SCREEN : g.BLEND);
        g.noFill();
        g.strokeCap(g.ROUND);
        const NTRAILS = SECONDARY_MODE ? 45 : 120;
        for (let i = 0; i < NTRAILS; i++) {
            let x = random(-100, CANVAS_W * 0.55);
            let y = random(CANVAS_H * 0.02, CANVAS_H * 0.98);
            const trailHex = lerpHexToHex(pickBucket(acc, accT), '#ffffff', 0.15 + random() * 0.50);
            const c = hexToRgb(trailHex);
            const isGust = random() < 0.35;
            const curlScale = 0.003 + random() * 0.003;
            const speedX = 3.0 + random() * 4.5;

            // Collect the path points first
            const pts = [];
            for (let step = 0; step < 120; step++) {
                if (x > CANVAS_W + 100 || y < -50 || y > CANVAS_H + 50) break;
                pts.push({ x, y });
                const cn = curlNoise(x, y, curlScale, 0.3);
                x += speedX + cn.dx * 12;
                y += cn.dy * 3.5 + (noise(x * 0.002, y * 0.002 + 88) - 0.5) * 8;
            }
            if (pts.length < 4) continue;

            // Wide + very transparent outer gust, narrowing to a semi-transparent core
            const passes = isGust
                ? [{ w: 22, a: 12 }, { w: 12, a: 20 }, { w: 5, a: 35 }, { w: 1.5, a: 55 }]
                : [{ w: 14, a: 10 }, { w: 6,  a: 18 }, { w: 2,  a: 38 }];

            for (const { w, a } of passes) {
                g.stroke(c[0], c[1], c[2], a);
                g.strokeWeight(w);
                g.beginShape();
                g.curveVertex(pts[0].x, pts[0].y);
                for (const pt of pts) g.curveVertex(pt.x, pt.y);
                g.curveVertex(pts[pts.length - 1].x, pts[pts.length - 1].y);
                g.endShape();
            }
        }
        g.pop();
        g.blendMode(g.BLEND);

        // 6. High-altitude cirrus streamers (skip stratus in secondary to avoid horizontal lines)
        g.push();
        g.blendMode(g.SCREEN);
        g.noFill();
        const NCIRRUS = SECONDARY_MODE ? 12 : 30;
        for (let i = 0; i < NCIRRUS; i++) {
            const y0 = random(CANVAS_H * 0.02, CANVAS_H * 0.50);
            if (spriteHaloMask(CANVAS_W * 0.5, y0) > 0.6) continue;
            const c = hexToRgb(lerpHexToHex(pickBucket(acc, accT), '#ffffff', 0.40));
            g.stroke(c[0], c[1], c[2], 30 + random() * 55);
            g.strokeWeight(0.5 + random() * 1.3);
            g.beginShape();
            let x = random(-40, CANVAS_W * 0.5), y = y0;
            for (let step = 0; step < 110; step++) {
                if (x > CANVAS_W + 50) break;
                g.vertex(x, y);
                const cn = curlNoise(x, y, 0.0020, 0.5);
                x += 5 + cn.dx * 5;
                y += cn.dy * 3 + (noise(x * 0.004, y0 * 0.007) - 0.5) * 6;
            }
            g.endShape();
        }
        g.pop();
        g.blendMode(g.BLEND);

        applyVignette(g, 0.28);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: BUG — hexagonal compound eye tiling with palette-sampled cells
    // ═══════════════════════════════════════════════════════════════════════
    function engineBug(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.45);
        const bot = lerpHex(sub, prim, 0.15);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // Hexagonal grid with per-cell color from palette
        const hexSize = 22;
        const hRow = hexSize * 1.5;
        const hCol = hexSize * Math.sqrt(3);
        for (let row = -1; row * hRow < CANVAS_H + hRow; row++) {
            for (let col = -1; col * hCol < CANVAS_W + hCol; col++) {
                const cx = col * hCol + (row % 2) * hCol * 0.5;
                const cy = row * hRow;
                if (spriteHaloMask(cx, cy) > 0.5) continue;
                // Sample local color from noise field through palette
                const n = noise(cx * 0.007, cy * 0.007);
                const hex = n < 0.5 ? pickBucket(body, bodyT) : pickBucket(acc, accT);
                const c = hexToRgb(hex);
                const path = [];
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3 - Math.PI / 6;
                    path.push({ x: cx + Math.cos(a) * hexSize, y: cy + Math.sin(a) * hexSize });
                }
                // Inner edge gradient — lens-like
                fillPathLinearGradient(g, path, cx - hexSize, cy - hexSize, cx + hexSize, cy + hexSize, [
                    { at: 0, hex, alpha: 0.95 },
                    { at: 1, hex: lerpHexToHex(hex, '#000000', 0.40), alpha: 0.95 }
                ]);
                // Outline
                g.push();
                g.noFill();
                g.stroke(0, 0, 0, 60);
                g.strokeWeight(0.6);
                g.beginShape();
                for (const pt of path) g.vertex(pt.x, pt.y);
                g.endShape(g.CLOSE);
                g.pop();
            }
        }

        // Per-facet micro-lens — every hex cell gets a dark pseudopupil + specular
        // This is what makes it read as a compound eye (not scattered large pupils)
        g.push();
        g.noStroke();
        for (let row = -1; row * hRow < CANVAS_H + hRow; row++) {
            for (let col = -1; col * hCol < CANVAS_W + hCol; col++) {
                const cx = col * hCol + (row % 2) * hCol * 0.5;
                const cy = row * hRow;
                if (spriteHaloMask(cx, cy) > 0.5) continue;
                // Dark pseudopupil at center of each facet
                const pAlpha = 65 + (noise(cx * 0.014, cy * 0.014) - 0.5) * 40;
                g.fill(0, 0, 0, pAlpha);
                g.circle(cx, cy, hexSize * 0.32);
                // Specular glint — upper-left of each facet (consistent light direction)
                const sAlpha = 50 + noise(cx * 0.016 + 9, cy * 0.016) * 50;
                g.fill(255, 255, 255, sAlpha);
                g.circle(cx - hexSize * 0.22, cy - hexSize * 0.22, hexSize * 0.24);
            }
        }
        g.pop();

        // Overall dome curvature — large radial glow suggesting the eye's curved surface
        const domeCx = CANVAS_W * (0.35 + random() * 0.30);
        const domeCy = CANVAS_H * (0.28 + random() * 0.25);
        radialFillCircle(g, domeCx, domeCy, CANVAS_H * 0.72, [
            { at: 0,    hex: lerpHexToHex(pickBucket(acc, accT), '#ffffff', 0.55), alpha: 0.18 },
            { at: 0.35, hex: pickBucket(acc, accT), alpha: 0.08 },
            { at: 1,    hex: sub, alpha: 0 }
        ]);

        // Iridescent shimmer pass — color-shift accent overlay based on hex position
        g.push();
        g.blendMode(g.SCREEN);
        g.noStroke();
        for (let row = -1; row * hexSize * 1.5 < CANVAS_H + hexSize; row++) {
            for (let col = -1; col * hexSize * Math.sqrt(3) < CANVAS_W + hexSize; col++) {
                const cx = col * hexSize * Math.sqrt(3) + (row % 2) * hexSize * Math.sqrt(3) * 0.5;
                const cy = row * hexSize * 1.5;
                if (spriteHaloMask(cx, cy) > 0.5) continue;
                // Shimmer intensity driven by noise — only some cells shimmer
                const shimmer = noise(cx * 0.022, cy * 0.022 + 500);
                if (shimmer < 0.60) continue;
                const iridT = (shimmer - 0.60) / 0.40;
                // Cycle through accent colors based on position
                const iridHex = pickBucket(acc, accT);
                const ic = hexToRgb(iridHex);
                const path2 = [];
                for (let vi = 0; vi < 6; vi++) {
                    const a = vi * Math.PI / 3 - Math.PI / 6;
                    path2.push({ x: cx + Math.cos(a) * hexSize, y: cy + Math.sin(a) * hexSize });
                }
                fillPathLinearGradient(g, path2,
                    cx - hexSize * 0.5, cy - hexSize * 0.5,
                    cx + hexSize * 0.5, cy + hexSize * 0.5,
                    [{ at: 0, hex: iridHex, alpha: iridT * 0.5 },
                     { at: 1, hex: iridHex, alpha: iridT * 0.15 }]);
            }
        }
        g.pop();
        g.blendMode(g.BLEND);

        // Gossamer silk web — bright white threads clearly visible over the hex grid
        const webNodes = poissonRect(10, CANVAS_W - 10, 10, CANVAS_H - 10, 38, 70);
        g.push();
        g.noFill();
        g.strokeCap(g.ROUND);
        const MAX_SILK = 160;
        for (let i = 0; i < webNodes.length; i++) {
            for (let j = i + 1; j < webNodes.length; j++) {
                const n1 = webNodes[i], n2 = webNodes[j];
                const dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
                if (dist > MAX_SILK) continue;
                const mid = { x: (n1.x + n2.x) / 2, y: (n1.y + n2.y) / 2 };
                if (spriteHaloMask(mid.x, mid.y) > 0.5) continue;
                const t = 1 - dist / MAX_SILK;
                // Sag the thread slightly downward (like real silk catching gravity)
                const mx = mid.x + (noise(n1.x * 0.008, n2.y * 0.008) - 0.5) * 18;
                const my = mid.y + Math.abs(noise(n2.x * 0.008, n1.y * 0.008) - 0.5) * 10 + (noise(n1.x * 0.008, n1.y * 0.008) - 0.5) * 12;
                // Soft glow halo
                g.stroke(240, 248, 255, t * 60);
                g.strokeWeight(3.0);
                g.beginShape();
                g.curveVertex(n1.x, n1.y); g.curveVertex(n1.x, n1.y);
                g.curveVertex(mx, my);
                g.curveVertex(n2.x, n2.y); g.curveVertex(n2.x, n2.y);
                g.endShape();
                // Bright white core thread
                g.stroke(255, 255, 255, t * 180);
                g.strokeWeight(0.7);
                g.beginShape();
                g.curveVertex(n1.x, n1.y); g.curveVertex(n1.x, n1.y);
                g.curveVertex(mx, my);
                g.curveVertex(n2.x, n2.y); g.curveVertex(n2.x, n2.y);
                g.endShape();
            }
        }
        g.pop();

        applyVignette(g, 0.40);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: ROCK — cracked Voronoi-like cell stone
    // ═══════════════════════════════════════════════════════════════════════
    function engineRock(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.30);
        const bot = lerpHex(sub, prim, 0.20);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // Build Voronoi sites via Poisson, including some bright accents
        const sites = poissonRect(-20, CANVAS_W + 20, -20, CANVAS_H + 20, 55, 120);
        for (const s of sites) {
            // Vary cell brightness: occasional bright accent cells
            s.hex = random() < 0.18
                ? pickBucket(acc, accT)
                : pickBucket(body, bodyT);
        }
        // Render Voronoi cells directly as rectangles (avoids p5.Graphics buffer issues)
        const SCALE = 5;
        g.noStroke();
        for (let wy = 0; wy < CANVAS_H; wy += SCALE) {
            for (let wx = 0; wx < CANVAS_W; wx += SCALE) {
                let best = 0, bestD = Infinity, secD = Infinity;
                for (let i = 0; i < sites.length; i++) {
                    const dx = wx - sites[i].x, dy = wy - sites[i].y;
                    const d = dx * dx + dy * dy;
                    if (d < bestD) { secD = bestD; bestD = d; best = i; }
                    else if (d < secD) secD = d;
                }
                const edge = Math.sqrt(secD) - Math.sqrt(bestD);
                const c = hexToRgb(sites[best].hex);
                const k = edge < 3.5 ? 0.30 : 1.0;
                g.fill(c[0] * k, c[1] * k, c[2] * k);
                g.rect(wx, wy, SCALE + 1, SCALE + 1);
            }
        }

        // Cracks along edges via lightning lines between adjacent sites
        for (let i = 0; i < sites.length; i++) {
            for (let j = i + 1; j < sites.length; j++) {
                const dx = sites[i].x - sites[j].x, dy = sites[i].y - sites[j].y;
                if (dx * dx + dy * dy > 13000) continue;
                if (random() > 0.30) continue;
                const mx = (sites[i].x + sites[j].x) / 2;
                const my = (sites[i].y + sites[j].y) / 2;
                if (spriteHaloMask(mx, my) > 0.5) continue;
                drawLightning(g, sites[i].x, sites[i].y, sites[j].x, sites[j].y, 3, 0.15,
                    pickBucket(acc, accT), 90, 0.6);
            }
        }

        // Mineral grit
        g.push();
        g.blendMode(g.SCREEN);
        g.noStroke();
        for (let k = 0; k < 200; k++) {
            const x = random(CANVAS_W), y = random(CANVAS_H);
            if (spriteHaloMask(x, y) > 0.5) continue;
            const [r, gn, b] = hexToRgb(pickBucket(acc, accT));
            g.fill(r, gn, b, 80);
            g.circle(x, y, 0.5 + random() * 1.0);
        }
        g.pop();
        g.blendMode(g.BLEND);
        applyVignette(g, 0.40);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: GHOST — dense wisps + density inversion + spectral beams
    // ═══════════════════════════════════════════════════════════════════════
    function engineGhost(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.20);
        const bot = lerpHex(sub, prim, 0.20);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // Ghost shape layer: noise-based dark patches for negative-space silhouettes
        g.noStroke();
        for (let gy = 0; gy < CANVAS_H; gy += 8) {
            for (let gx = 0; gx < CANVAS_W; gx += 8) {
                if (spriteHaloMask(gx, gy) > 0.5) continue;
                const n = noise(gx * 0.006, gy * 0.006);
                if (n > 0.68) {
                    const subRgb = hexToRgb(sub);
                    g.fill(subRgb[0], subRgb[1], subRgb[2], 80 * (n - 0.68) / 0.32);
                    g.rect(gx, gy, 8, 8);
                }
            }
        }

        // Ethereal glow patches — soft radial blobs scattered around canvas
        // (replaces the "weird stripes" from the beam approach)
        const glowPatches = poissonRect(30, CANVAS_W - 30, 30, CANVAS_H - 30, 80, 18);
        for (const gp of glowPatches) {
            if (spriteHaloMask(gp.x, gp.y) > 0.45) continue;
            const hex = pickBucket(body, bodyT);
            const r = 50 + random() * 90;
            radialFillCircle(g, gp.x, gp.y, r, [
                { at: 0,   hex, alpha: 0.12 },
                { at: 0.6, hex, alpha: 0.06 },
                { at: 1,   hex: sub, alpha: 0 }
            ]);
        }

        // Wisp paths: each uses its own noise seed so they take varied paths
        g.push();
        g.noFill();
        const NWISPS = 280;
        for (let i = 0; i < NWISPS; i++) {
            const x0 = random(CANVAS_W), y0 = random(CANVAS_H);
            const wispSeed = random() * 9999;   // unique per wisp — no more uniform flow
            // Mix body and accent wisps for visible color variation
            const useAccent = random() < 0.30;
            const hex = useAccent ? pickBucket(acc, accT) : pickBucket(body, bodyT);
            const c = hexToRgb(hex);
            // Accent wisps are brighter; body wisps are softer
            g.stroke(c[0], c[1], c[2], useAccent ? 80 + random() * 70 : 45 + random() * 45);
            g.strokeWeight(useAccent ? 1.6 + random() * 1.8 : 1.0 + random() * 2.0);
            g.strokeCap(g.ROUND);
            let x = x0, y = y0;
            g.beginShape();
            const steps = 40 + Math.floor(random() * 40);
            for (let k = 0; k < steps; k++) {
                if (spriteHaloMask(x, y) > 0.6) break;
                g.vertex(x, y);
                const w = domainWarp(x, y, 5, wispSeed);
                const ang = noise(x * 0.004 + wispSeed * 0.01, y * 0.004) * Math.PI * 4;
                x += Math.cos(ang) * 4.5 + w.dx * 0.4;
                y += Math.sin(ang) * 4.5 + w.dy * 0.4;
            }
            g.endShape();
        }
        g.pop();

        // Will-o-wisps (22, up from 14)
        const glows = poissonRect(30, CANVAS_W - 30, 30, CANVAS_H - 30, 65, 22);
        for (const gl of glows) {
            if (spriteHaloMask(gl.x, gl.y) > 0.4) continue;
            const hex = pickBucket(acc, accT);
            const r2 = 35 + random() * 45;
            radialFillCircle(g, gl.x, gl.y, r2, [
                { at: 0,   hex: lerpHexToHex(hex, '#ffffff', 0.55), alpha: 0.85 },
                { at: 0.35, hex, alpha: 0.55 },
                { at: 1,   hex: sub, alpha: 0 }
            ]);
        }
        applyVignette(g, 0.55);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: DRAGON — multi-foci particle accretion + cosmic dust
    // ═══════════════════════════════════════════════════════════════════════
    function engineDragon(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.55);
        const bot = lerpHex(sub, prim, 0.10);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        const foci = [
            { x: CANVAS_W * 0.30, y: CANVAS_H * 0.32, mass: 1.0 },
            { x: CANVAS_W * 0.50, y: CANVAS_H * 0.55, mass: 0.6 }
        ];

        // Nebula gas clouds — large soft blobs before particles
        const nebulaPositions = poissonRect(40, CANVAS_W - 40, 40, CANVAS_H - 40, 150, 8);
        for (const nb of nebulaPositions) {
            if (spriteHaloMask(nb.x, nb.y) > 0.5) continue;
            const nbHex = pickBucket(body, bodyT);
            const nbR = 80 + random() * 130;
            radialFillCircle(g, nb.x, nb.y, nbR, [
                { at: 0,   hex: nbHex,                           alpha: 0.22 },
                { at: 0.5, hex: lerpHexToHex(nbHex, prim, 0.4), alpha: 0.10 },
                { at: 1,   hex: sub,                             alpha: 0 }
            ]);
        }

        // Particle accretion — each particle samples its own color for variety
        const N = 3000;
        g.push();
        g.blendMode(g.SCREEN);
        g.strokeCap(g.ROUND);
        g.noFill();
        for (let i = 0; i < N; i++) {
            let x = random(CANVAS_W);
            let y = random(CANVAS_H);
            let nearest = foci[0];
            for (const f of foci) {
                const d1 = Math.hypot(x - nearest.x, y - nearest.y);
                const d2 = Math.hypot(x - f.x, y - f.y);
                if (d2 < d1) nearest = f;
            }
            const r0 = Math.hypot(x - nearest.x, y - nearest.y) || 1;
            let vx = -(y - nearest.y) / r0 * 1.5;
            let vy =  (x - nearest.x) / r0 * 1.5;
            // Each particle gets its own color pair for palette variety
            const baseHex = pickBucket(body, bodyT);
            const tipHex  = pickBucket(acc, accT);

            // Shorter trails near foci, longer at periphery — less geometric
            const maxSteps = Math.max(4, Math.floor(4 + r0 / 22 + random() * 6));
            for (let step = 0; step < maxSteps; step++) {
                const px = x, py = y;
                let ax = 0, ay = 0;
                for (const f of foci) {
                    const dx = f.x - x, dy = f.y - y;
                    const d = Math.hypot(dx, dy);
                    if (d < 10) continue;
                    ax += dx / d * f.mass * 80 / (d * d);
                    ay += dy / d * f.mass * 80 / (d * d);
                }
                // Add curl-noise turbulence to break geometric arc patterns
                const ns = noise(x * 0.012, y * 0.012, step * 0.08);
                ax += (ns - 0.5) * 0.6;
                ay += (noise(x * 0.012 + 7.3, y * 0.012 + 2.1, step * 0.08) - 0.5) * 0.6;
                vx += ax * 0.1;
                vy += ay * 0.1;
                x += vx;
                y += vy;
                if (x < 0 || x > CANVAS_W || y < 0 || y > CANVAS_H) break;
                if (spriteHaloMask(x, y) > 0.6) break;
                let dN = Infinity;
                for (const f of foci) {
                    const d = Math.hypot(x - f.x, y - f.y);
                    if (d < dN) dN = d;
                }
                const heat = Math.max(0, 1 - dN / 280);
                const col = lerpHex(baseHex, tipHex, heat);
                g.stroke(col[0], col[1], col[2], 55 + heat * 90);
                g.strokeWeight(0.4 + heat * 1.3);
                g.line(px, py, x, y);
            }
        }
        g.pop();
        g.blendMode(g.BLEND);

        // Bright nuclei at each focus
        for (const f of foci) {
            radialFillCircle(g, f.x, f.y, 80,
                [{ at: 0, hex: pickBucket(acc, accT), alpha: 0.85 },
                 { at: 0.4, hex: prim, alpha: 0.4 },
                 { at: 1, hex: sub, alpha: 0 }]);
        }

        // Star field (150 stars)
        g.push();
        g.blendMode(g.SCREEN);
        g.noStroke();
        for (let k = 0; k < 150; k++) {
            const x = random(CANVAS_W), y = random(CANVAS_H);
            if (spriteHaloMask(x, y) > 0.5) continue;
            const [r, gn, b] = hexToRgb(pickBucket(acc, accT));
            g.fill(r, gn, b, 80 + random() * 150);
            g.circle(x, y, 0.4 + random() * 1.8);
        }
        g.pop();
        g.blendMode(g.BLEND);

        applyVignette(g, 0.50);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: STEEL — brushed metal + rivets + seams + hex grid + specular
    // ═══════════════════════════════════════════════════════════════════════
    function engineSteel(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.35);
        const bot = lerpHex(sub, prim, 0.25);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        // Subtle hex grid overlay — industrial texture at very low alpha
        const HEX_SIZE = 28;
        const hRow = HEX_SIZE * 1.5;
        const hCol = HEX_SIZE * Math.sqrt(3);
        g.push();
        g.noFill();
        g.stroke(255, 255, 255, 12);
        g.strokeWeight(0.5);
        for (let row = -1; row * hRow < CANVAS_H + hRow; row++) {
            for (let col = -1; col * hCol < CANVAS_W + hCol; col++) {
                const cx = col * hCol + (row % 2) * hCol * 0.5;
                const cy = row * hRow;
                if (spriteHaloMask(cx, cy) > 0.4) continue;
                g.beginShape();
                for (let vi = 0; vi < 6; vi++) {
                    const a = vi * Math.PI / 3 - Math.PI / 6;
                    g.vertex(cx + Math.cos(a) * HEX_SIZE, cy + Math.sin(a) * HEX_SIZE);
                }
                g.endShape(g.CLOSE);
            }
        }
        g.pop();

        // Anisotropic brushed striations — varied length and density
        const brushAng = (random() - 0.5) * 0.4;
        g.push();
        g.noFill();
        g.strokeCap(g.SQUARE);
        for (let i = 0; i < 700; i++) {
            const x = random(-60, CANVAS_W + 60);
            const y = random(-30, CANVAS_H + 30);
            if (spriteHaloMask(x + 40, y + 40) > 0.5) continue;
            const hex = pickBucket(body, bodyT);
            const c = hexToRgb(hex);
            // Varied lengths: some short (texture), some long (structure)
            const len = random() < 0.3 ? 30 + random() * 60 : 100 + random() * 280;
            const luma = 0.5 + (noise(x * 0.01, y * 0.01) - 0.5) * 0.7;
            g.stroke(c[0] * luma, c[1] * luma, c[2] * luma, 70 + random() * 40);
            g.strokeWeight(0.4 + random() * 0.9);
            const sx = Math.sin(brushAng) * len, sy = Math.cos(brushAng) * len;
            g.line(x, y, x + sx, y + sy);
        }
        g.pop();

        // Seam lines: 2 thin parallel lines near edges
        const seamHex = pickBucket(body, bodyT);
        const seamRgb = hexToRgb(seamHex);
        g.push();
        g.noFill();
        g.stroke(seamRgb[0], seamRgb[1], seamRgb[2], 100);
        g.strokeWeight(1.0);
        const seamOffsets = [30, 34];
        for (const so of seamOffsets) {
            g.line(so, so, CANVAS_W - so, so);
            g.line(so, CANVAS_H - so, CANVAS_W - so, CANVAS_H - so);
        }
        g.pop();

        // Rivets: 6–10 filled circles at perimeter positions
        const rivetHex = pickBucket(acc, accT);
        const rivetRgb = hexToRgb(rivetHex);
        const NRIVETS = 6 + Math.floor(random() * 5);
        const rivetPositions = [
            { x: 28, y: 28 }, { x: CANVAS_W - 28, y: 28 },
            { x: 28, y: CANVAS_H - 28 }, { x: CANVAS_W - 28, y: CANVAS_H - 28 },
            { x: CANVAS_W / 2, y: 28 }, { x: CANVAS_W / 2, y: CANVAS_H - 28 },
            { x: 28, y: CANVAS_H / 2 }, { x: CANVAS_W - 28, y: CANVAS_H / 2 },
            { x: CANVAS_W * 0.25, y: 28 }, { x: CANVAS_W * 0.75, y: CANVAS_H - 28 },
        ];
        g.push();
        g.noStroke();
        for (let ri = 0; ri < Math.min(NRIVETS, rivetPositions.length); ri++) {
            const rv = rivetPositions[ri];
            const r = 4 + random() * 2;
            radialFillCircle(g, rv.x, rv.y, r,
                [{ at: 0, hex: lerpHexToHex(rivetHex, '#ffffff', 0.4), alpha: 0.9 },
                 { at: 0.6, hex: rivetHex, alpha: 0.85 },
                 { at: 1, hex: lerpHexToHex(rivetHex, '#000000', 0.4), alpha: 0.8 }]);
        }
        g.pop();

        // Specular band: wider, more pronounced
        const ctx = g.drawingContext;
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const accHex = pickBucket(acc, accT);
        const accRgb = hexToRgb(accHex);
        const bandX = CANVAS_W * 0.38 + random() * CANVAS_W * 0.15;
        const bandW = 200 + random() * 80;
        const grad = ctx.createLinearGradient(bandX - bandW, 0, bandX + bandW, 0);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.5, `rgba(${accRgb[0]},${accRgb[1]},${accRgb[2]},0.55)`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.restore();

        applyVignette(g, 0.35);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: NORMAL — multi-scale curved truchet tiling with differential whorls
    // ═══════════════════════════════════════════════════════════════════════
    function engineNormal(g, p) {
        const roles = p.roles;
        const sub = roles.substrate, prim = roles.primary;
        const body = roles.buckets.body, bodyT = roles.buckets.bodyTotal;
        const acc = roles.buckets.accent, accT = roles.buckets.accentTotal;
        const top = lerpHex(sub, '#000000', 0.30);
        const bot = lerpHex(sub, prim, 0.20);
        gradientFill(g, rgbToHex(...top), rgbToHex(...bot));

        const warpSeed = random() * 1000;

        // Layer 1: Curved Truchet tiling — quarter-circle arcs at grid intersections
        // forming interwoven labyrinthine pathways.
        const TILE = 36;
        g.push();
        g.noFill();
        g.strokeCap(g.ROUND);
        for (let ty = 0; ty < CANVAS_H + TILE; ty += TILE) {
            for (let tx = 0; tx < CANVAS_W + TILE; tx += TILE) {
                if (spriteHaloMask(tx + TILE / 2, ty + TILE / 2) > 0.4) continue;
                // Two-state Truchet: which diagonal is the "knot"
                const seed = noise(tx * 0.018, ty * 0.018);
                const hex = pickBucket(body, bodyT);
                const col = hexToRgb(hex);
                g.stroke(col[0], col[1], col[2], 130);
                g.strokeWeight(3.2);
                if (seed < 0.5) {
                    g.arc(tx, ty, TILE, TILE, 0, Math.PI / 2);
                    g.arc(tx + TILE, ty + TILE, TILE, TILE, Math.PI, Math.PI * 1.5);
                } else {
                    g.arc(tx + TILE, ty, TILE, TILE, Math.PI / 2, Math.PI);
                    g.arc(tx, ty + TILE, TILE, TILE, Math.PI * 1.5, Math.PI * 2);
                }
            }
        }
        g.pop();

        // Layer 2: a few large concentric whorls (fingerprint-like accents)
        const centers = poissonRect(40, CANVAS_W - 40, 40, CANVAS_H - 40, 220, 5);
        g.push();
        g.noFill();
        g.strokeCap(g.ROUND);
        for (const c of centers) {
            if (spriteHaloMask(c.x, c.y) > 0.5) continue;
            const NLOOPS = 10 + Math.floor(random() * 6);
            const hex = pickBucket(acc, accT);
            const col = hexToRgb(hex);
            for (let i = 0; i < NLOOPS; i++) {
                const r = 12 + i * 10;
                g.stroke(col[0], col[1], col[2], 80 + random() * 60);
                g.strokeWeight(1.0 + random() * 0.8);
                g.beginShape();
                for (let a = 0; a < Math.PI * 2 + 0.1; a += 0.06) {
                    const wx = c.x + Math.cos(a) * r;
                    const wy = c.y + Math.sin(a) * r;
                    const w = domainWarp(wx, wy, 12, warpSeed);
                    g.vertex(wx + w.dx, wy + w.dy);
                }
                g.endShape();
            }
            // Center dot
            const accCol = hexToRgb(pickBucket(acc, accT));
            g.noStroke();
            g.fill(accCol[0], accCol[1], accCol[2], 220);
            g.circle(c.x, c.y, 4 + random() * 3);
            g.noFill();
        }
        g.pop();

        // Layer 3: scattered poisson dots for stippled texture
        g.push();
        g.noStroke();
        const dots = poissonRect(20, CANVAS_W - 20, 20, CANVAS_H - 20, 22, 200);
        for (const d of dots) {
            if (spriteHaloMask(d.x, d.y) > 0.5) continue;
            const hex = pickBucket(body, bodyT);
            const col = hexToRgb(hex);
            g.fill(col[0], col[1], col[2], 80);
            g.circle(d.x, d.y, 0.8 + random() * 1.5);
        }
        g.pop();

        applyVignette(g, 0.32);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ENGINE: FALLBACK (placeholder for unimplemented types)
    // Multi-octave noise field tinted by palette — still palette-driven and seeded.
    // ═══════════════════════════════════════════════════════════════════════
    function engineFallback(g, p, typeName) {
        const bg = darkestOf(p);
        g.background(bg);

        const palette = p.colors;
        const total = p.total;
        const SCALE = 6;
        const W = Math.ceil(CANVAS_W / SCALE);
        const H = Math.ceil(CANVAS_H / SCALE);
        const buf = createGraphics(W, H);
        buf.loadPixels();
        // Pre-sample a banded palette: top 6 colors at deciles
        const cols = topColors(p, 6).map(hexToRgb);
        for (let py = 0; py < H; py++) {
            for (let px = 0; px < W; px++) {
                const n = noise(px * 0.045, py * 0.045) * 0.7
                        + noise(px * 0.12,  py * 0.12)  * 0.3;
                const band = Math.min(cols.length - 1, Math.floor(n * cols.length));
                const c = cols[band];
                const idx = (py * W + px) * 4;
                buf.pixels[idx] = c[0]; buf.pixels[idx+1] = c[1];
                buf.pixels[idx+2] = c[2]; buf.pixels[idx+3] = 255;
            }
        }
        buf.updatePixels();
        g.image(buf, 0, 0, CANVAS_W, CANVAS_H);
        buf.remove();

        // Sparse palette flecks for texture
        g.noStroke();
        for (let i = 0; i < 400 * params.intensity; i++) {
            const c = hexToRgb(pickWeighted(palette, total));
            g.fill(c[0], c[1], c[2], 90);
            g.circle(random(CANVAS_W), random(CANVAS_H), random(1, 3));
        }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // COMPOSITING: VOID (illustration area) + CARD FRAME
    // ═══════════════════════════════════════════════════════════════════════
    // Sprite cache: id -> p5.Image | 'missing'
    const SPRITES = {};
    function ensureSprite(p) {
        if (SPRITES[p.id] !== undefined) return SPRITES[p.id];
        SPRITES[p.id] = 'loading';
        const path = `img/${String(p.id).padStart(3,'0')}_${p.name}.png`;
        loadImage(path,
            (img) => { SPRITES[p.id] = img; if (currentPokemon && currentPokemon.id === p.id) render(); },
            ()    => { SPRITES[p.id] = 'missing'; });
        return 'loading';
    }

    function voidRect() {
        // No surrounding border — just the bounding box the sprite is anchored to.
        // Bottom-right corner of the card, scaled by voidSize.
        const baseSide = 380;
        const side = baseSide * params.voidSize;
        const margin = 32;
        return {
            x: CANVAS_W - side - margin,
            y: CANVAS_H - side - margin,
            w: side, h: side
        };
    }
    function drawVoid(p) {
        const r = voidRect();
        const sprite = ensureSprite(p);
        if (sprite && sprite !== 'loading' && sprite !== 'missing') {
            // Crisp integer-scale, anchored to bottom of the rect
            const maxW = r.w, maxH = r.h;
            const scale = Math.max(1, Math.floor(Math.min(maxW / sprite.width, maxH / sprite.height)));
            const dw = sprite.width * scale, dh = sprite.height * scale;
            const dx = r.x + (r.w - dw) / 2;
            const dy = r.y + (r.h - dh); // anchor sprite to bottom of rect
            push();
            noSmooth();
            image(sprite, dx, dy, dw, dh);
            smooth();
            pop();
        } else if (sprite === 'loading') {
            push();
            noStroke();
            fill(0, 80);
            textAlign(CENTER, CENTER);
            textFont('Courier New');
            textSize(10);
            text('LOADING SPRITE…', r.x + r.w / 2, r.y + r.h / 2);
            pop();
        }
    }

    function drawFrame(p) {
        const alpha = params.frameOpacity * 255;
        const bannerY = 24;
        const bannerH = 46;
        const pad = 22;

        push();
        // Header banner: cream background, no card border
        noStroke();
        fill(245, 240, 225, alpha);
        rect(pad, bannerY, CANVAS_W - pad * 2, bannerH, 6);
        stroke(20, 20, 20, alpha * 0.25);
        strokeWeight(1);
        noFill();
        rect(pad, bannerY, CANVAS_W - pad * 2, bannerH, 6);

        // Pokémon number (left)
        noStroke();
        fill(20, 20, 20, alpha * 0.55);
        textAlign(LEFT, CENTER);
        textFont('Courier New');
        textSize(12);
        text(`No. ${String(p.id).padStart(3,'0')}`, pad + 14, bannerY + bannerH / 2);

        // Pokémon name (center-left, after number)
        fill(20, 20, 20, alpha);
        textAlign(LEFT, CENTER);
        textFont('Lora');
        textStyle(BOLD);
        textSize(22);
        const displayName = p.name.charAt(0).toUpperCase() + p.name.slice(1).replace(/-/g, ' ');
        text(displayName, pad + 70, bannerY + bannerH / 2);

        // Type chips (right side)
        textFont('Poppins');
        textStyle(NORMAL);
        textSize(10);
        textAlign(CENTER, CENTER);
        let chipX = CANVAS_W - pad - 14;
        for (let i = p.types.length - 1; i >= 0; i--) {
            const t = p.types[i];
            const c = hexToRgb(TYPE_COLOR[t]);
            const label = t.toUpperCase();
            const tw = textWidth(label) + 16;
            noStroke();
            fill(c[0], c[1], c[2], alpha);
            rect(chipX - tw, bannerY + bannerH / 2 - 10, tw, 20, 10);
            fill(255, alpha);
            text(label, chipX - tw / 2, bannerY + bannerH / 2);
            chipX -= tw + 6;
        }

        pop();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // UI HANDLERS
    // ═══════════════════════════════════════════════════════════════════════
    function selectPokemon(idStr) {
        const id = parseInt(idStr, 10);
        if (!POKEDEX[id]) return;
        params.pokemonId = id;
        currentPokemon = POKEDEX[id];
        const sel = document.getElementById('pokemon-select');
        if (sel && sel.value !== String(id)) sel.value = String(id);
        renderMetaPanel();
        render();
    }
    function renderMetaPanel() {
        const p = currentPokemon;
        const meta = document.getElementById('meta');
        meta.innerHTML = '';
        p.types.forEach(t => {
            const span = document.createElement('span');
            span.className = 'chip';
            span.style.background = TYPE_COLOR[t];
            span.textContent = t;
            meta.appendChild(span);
        });
        // Palette strip — widths proportional to frequency, top 12 only
        const strip = document.getElementById('palette-strip');
        strip.innerHTML = '';
        const top = p.colors.slice(0, 12);
        const sum = top.reduce((s, c) => s + c.count, 0);
        top.forEach(c => {
            const div = document.createElement('div');
            div.style.background = c.hex;
            div.style.flex = (c.count / sum).toString();
            div.title = `${c.hex} (${c.count}px)`;
            strip.appendChild(div);
        });
        // Roles panel: substrate / primary / secondary / accents
        const panel = document.getElementById('roles-panel');
        const r = p.roles;
        const row = (label, hex) => `
            <div class="role-row">
                <span class="lbl">${label}</span>
                <span class="sw" style="background:${hex}" title="${hex}"></span>
                <span>${hex}</span>
            </div>`;
        const accentSwatches = r.accent.map(h =>
            `<span class="sw" style="background:${h}" title="${h}"></span>`).join('');
        panel.innerHTML =
            row('substrate', r.substrate) +
            row('primary',   r.primary) +
            row('secondary', r.secondary) +
            `<div class="role-row"><span class="lbl">accent</span><span class="accent-row">${accentSwatches}</span></div>` +
            row('outline',   r.outline);
    }
    function updateParam(name, value) {
        if (name === 'showFrame' || name === 'showVoid') {
            params[name] = value;
        } else {
            params[name] = parseFloat(value);
            const disp = document.getElementById(name + '-value');
            if (disp) disp.textContent = parseFloat(value).toFixed(2);
        }
        render();
    }
    function updateSeedDisplay() {
        document.getElementById('seed-input').value = params.seed;
    }
    function updateSeed() {
        const v = parseInt(document.getElementById('seed-input').value, 10);
        if (Number.isFinite(v) && v > 0) { params.seed = v; render(); }
        else updateSeedDisplay();
    }
    function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); render(); }
    function nextSeed() { params.seed += 1; updateSeedDisplay(); render(); }
    function randomSeedAndUpdate() {
        params.seed = Math.floor(Math.random() * 999999) + 1;
        updateSeedDisplay(); render();
    }
    function resetParameters() {
        params = {...defaultParams};
        document.getElementById('intensity').value = params.intensity;
        document.getElementById('intensity-value').textContent = params.intensity.toFixed(2);
        document.getElementById('voidSize').value = params.voidSize;
        document.getElementById('voidSize-value').textContent = params.voidSize.toFixed(2);
        document.getElementById('frameOpacity').value = params.frameOpacity;
        document.getElementById('frameOpacity-value').textContent = params.frameOpacity.toFixed(2);
        document.getElementById('showFrame').checked = params.showFrame;
        document.getElementById('showVoid').checked = params.showVoid;
        document.getElementById('pokemon-select').value = params.pokemonId;
        currentPokemon = POKEDEX[params.pokemonId];
        renderMetaPanel();
        updateSeedDisplay();
        render();
    }
    function downloadCanvas() {
        const p = currentPokemon;
        const name = `${String(p.id).padStart(3,'0')}-${p.name}-seed${params.seed}`;
        saveCanvas(name, 'png');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BOOT
    // ═══════════════════════════════════════════════════════════════════════
    window.addEventListener('load', async () => {
        try {
            await loadPokedex();
            populateDropdown();
            currentPokemon = POKEDEX[params.pokemonId];
            renderMetaPanel();
            updateSeedDisplay();
            // setup() may have already fired before loadPokedex resolved.
            // If canvas exists, render now; otherwise setup() will call render().
            if (typeof width !== 'undefined' && width > 0) render();
        } catch (e) {
            document.querySelector('.loading').textContent = 'Error: ' + e.message + ' — serve over HTTP (e.g. `python -m http.server` from project root).';
            console.error(e);
        }
    });
    </script>
</body>
